name: CI
on: [push, pull_request]
jobs:
  scan-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks CLI)
        run: |
          set -e
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
          echo "Secret scan clean."
      - name: Brand-asset scan
        run: |
          set -e
          PATTERNS='Darwin_v3|primate-intelligence-logo|primate-vision-logo|logo-dark\.svg'
          if git grep -IlE "$PATTERNS" -- . ':!/.github/workflows/ci.yml'; then
            echo "::error::Brand asset reference found — Primate brand assets must not enter public repos."
            exit 1
          fi
          if find . -path ./node_modules -prune -o -type f \( -name '*Darwin*' -o -name '*primate*logo*' \) -print | grep -q .; then
            echo "::error::Brand asset file found."
            exit 1
          fi
          echo "Brand scan clean."
      - name: Skeleton check
        run: test -f README.md && test -f LICENSE && test -f NOTICE && echo "skeleton ok"
      # C2 clean-machine gate (wired pre-GA): install from a fresh checkout,
      # typecheck, build the SPA, and boot the token-mint server. The live
      # sandbox end-to-end (mint real pvct_ → upload fixture → analysis)
      # activates at GA when the sandbox endpoint is on prod.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean-machine install + typecheck + build
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Token-mint server boots
        run: |
          PRIMATE_API_KEY=pv_test_ci_dummy PORT=3199 timeout 5 node server/mint.js &
          sleep 2
          curl -sf -X POST http://localhost:3199/api/token -o /dev/null -w "%{http_code}" | grep -qE "4..|2.." && echo "mint server responds"
